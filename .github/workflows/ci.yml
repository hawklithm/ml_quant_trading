name: quant-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scipy scikit-learn pytest
      - name: Validate configuration
        run: python -m json.tool v5_config.json > /dev/null
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline tests
        run: pytest -q
